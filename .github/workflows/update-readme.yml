name: Update profile README

on:
  schedule:
    - cron: "17 1 * * *"      # every day at 06:47 IST
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", "config/**", ".github/workflows/update-readme.yml", "README.md"]

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild projects and activity sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          # HIDE_REPOS: "repo-one,repo-two"   # uncomment to hide repos from the table
        run: python3 scripts/update_readme.py

      - name: Commit if something changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh projects and activity"
            git push
          fi
